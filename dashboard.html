<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Fatih Durdu</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #141414; --border: #1e1e1e;
    --text: #e8e6e1; --muted: #555; --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.12);
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; font-weight: 300; min-height: 100vh; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 3rem; background: rgba(13,13,13,0.9);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--text); text-decoration: none; }
  .nav-right { display: flex; align-items: center; gap: 1.5rem; }
  .nav-user { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; }
  .nav-user span { color: var(--accent); }
  .nav-logout { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; cursor: pointer; transition: color 0.2s; }
  .nav-logout:hover { color: var(--text); }
  main { padding: 7rem 3rem 4rem; max-width: 1000px; margin: 0 auto; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.4rem; }
  .page-sub { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 3rem; }
  .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1px; background: var(--border); margin-bottom: 3rem; }
  .service-card {
    background: var(--bg); padding: 1.8rem 1.5rem;
    display: flex; flex-direction: column; align-items: flex-start; gap: 1rem;
    text-decoration: none; color: var(--text);
    transition: background 0.2s; cursor: pointer;
  }
  .service-card:hover { background: var(--surface); }
  .service-card img { width: 32px; height: 32px; object-fit: contain; filter: brightness(0.8); transition: filter 0.2s; }
  .service-card:hover img { filter: brightness(1); }
  .service-name { font-size: 0.78rem; letter-spacing: 0.05em; }
  .service-arrow { font-size: 0.65rem; color: var(--muted); margin-top: auto; transition: color 0.2s; }
  .service-card:hover .service-arrow { color: var(--accent); }
  .section-title { font-family: 'DM Serif Display', serif; font-size: 1rem; margin-bottom: 1.5rem; color: var(--text); }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1px; background: var(--border); margin-bottom: 3rem; }
  .info-card { background: var(--bg); padding: 1.5rem; }
  .info-label { font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.5rem; }
  .info-value { font-size: 0.85rem; color: var(--text); }
  .invite-section { margin-bottom: 3rem; }
  .invite-btn {
    padding: 0.6rem 1.2rem; border: 1px solid var(--accent); color: var(--accent);
    background: transparent; font-family: 'DM Mono', monospace; font-size: 0.68rem;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    transition: background 0.2s, color 0.2s; margin-bottom: 1.5rem;
  }
  .invite-btn:hover { background: var(--accent); color: var(--bg); }
  .invite-list { list-style: none; }
  .invite-item { display: flex; align-items: center; gap: 2rem; padding: 0.8rem 0; border-top: 1px solid var(--border); font-size: 0.75rem; }
  .invite-code { color: var(--accent); letter-spacing: 0.1em; font-size: 0.8rem; }
  .invite-status { color: var(--muted); font-size: 0.65rem; }
  .invite-used { color: #4caf50; }
  .admin-section { margin-bottom: 3rem; }
  .users-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  .users-table th { text-align: left; padding: 0.6rem 1rem; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .users-table td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); color: var(--text); }
  .role-badge { font-size: 0.6rem; padding: 0.2rem 0.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .role-admin { color: var(--accent); border: 1px solid var(--accent); }
  .role-user { color: var(--muted); border: 1px solid var(--border); }
  @media (max-width: 600px) { nav { padding: 1rem 1.5rem; } main { padding: 6rem 1.5rem 3rem; } }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">Fatih Durdu</a>
  <div class="nav-right">
    <span class="nav-user">Merhaba, <span id="navUsername">—</span></span>
    <button class="nav-logout" onclick="logout()">Çıkış →</button>
  </div>
</nav>

<main>
  <h1 class="page-title">Dashboard</h1>
  <p class="page-sub" id="pageRole">—</p>

  <div class="services-grid" id="servicesGrid"></div>

  <div class="info-grid" id="infoGrid"></div>

  <div class="invite-section">
    <h2 class="section-title">Davet Kodları</h2>
    <button class="invite-btn" onclick="createInvite()">+ Yeni Kod Oluştur</button>
    <ul class="invite-list" id="inviteList"></ul>
  </div>

  <div class="admin-section" id="adminSection" style="display:none">
    <h2 class="section-title">Kullanıcılar</h2>
    <table class="users-table">
      <thead><tr><th>Kullanıcı</th><th>E-posta</th><th>Rol</th><th>Kayıt</th></tr></thead>
      <tbody id="usersTable"></tbody>
    </table>
  </div>
</main>

<script>
const API = 'https://api.fatihdurdu.xyz';

function getToken() { return localStorage.getItem('token'); }

function logout() {
  localStorage.removeItem('token');
  window.location.href = '/';
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json', ...opts.headers }
  });
  return res.json();
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('tr-TR');
}

async function loadDashboard() {
  if (!getToken()) { window.location.href = '/'; return; }

  const data = await apiFetch('/api/me');
  if (data.error) { logout(); return; }

  const { user, services } = data;

  document.getElementById('navUsername').textContent = user.username;
  document.getElementById('pageRole').textContent = user.role === 'admin' ? 'Yönetici Paneli' : 'Kullanıcı Paneli';

  const grid = document.getElementById('servicesGrid');
  grid.innerHTML = services.map(s => `
    <a href="${s.url}" target="_blank" class="service-card">
      <img src="${s.icon}" alt="${s.name}" onerror="this.style.display='none'">
      <span class="service-name">${s.name}</span>
      <span class="service-arrow">Aç →</span>
    </a>
  `).join('');

  document.getElementById('infoGrid').innerHTML = `
    <div class="info-card"><div class="info-label">Kullanıcı Adı</div><div class="info-value">${user.username}</div></div>
    <div class="info-card"><div class="info-label">E-posta</div><div class="info-value">${user.email}</div></div>
    <div class="info-card"><div class="info-label">Referans Kodun</div><div class="info-value" style="color:var(--accent)">${user.referral_code}</div></div>
    <div class="info-card"><div class="info-label">Kayıt Tarihi</div><div class="info-value">${formatDate(user.created_at)}</div></div>
  `;

  loadInvites();

  if (user.role === 'admin') {
    document.getElementById('adminSection').style.display = 'block';
    const users = await apiFetch('/api/admin/users');
    document.getElementById('usersTable').innerHTML = users.map(u => `
      <tr>
        <td>${u.username}</td>
        <td>${u.email}</td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td>${formatDate(u.created_at)}</td>
      </tr>
    `).join('');
  }
}

async function loadInvites() {
  const invites = await apiFetch('/api/invites');
  const list = document.getElementById('inviteList');
  if (!invites.length) {
    list.innerHTML = '<li style="font-size:0.75rem;color:var(--muted);padding:1rem 0;border-top:1px solid var(--border)">Henüz davet kodu yok.</li>';
    return;
  }
  list.innerHTML = invites.map(i => `
    <li class="invite-item">
      <span class="invite-code">${i.code}</span>
      <span class="invite-status ${i.used_by_username ? 'invite-used' : ''}">
        ${i.used_by_username ? '✓ ' + i.used_by_username + ' kullandı' : 'Kullanılmadı'}
      </span>
      <span style="color:var(--muted);font-size:0.65rem">${formatDate(i.created_at)}</span>
    </li>
  `).join('');
}

async function createInvite() {
  const data = await apiFetch('/api/invites', { method: 'POST' });
  if (data.code) loadInvites();
}

loadDashboard();
</script>

</body>
</html>
